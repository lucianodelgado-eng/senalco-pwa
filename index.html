<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Técnico</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #122236;
      color: white;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    p { line-height: 1.5; }
    a, button {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 16px 0;
      padding: 14px;
      border-radius: 10px;
      background: #0077b6;
      color: white;
      border: 0;
      text-decoration: none;
      font-size: 17px;
      text-align: center;
      cursor: pointer;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Panel Técnico</h1>
  <p id="mensaje">La app tiene una nueva dirección.</p>

  <button id="respaldo" type="button" hidden>
    Descargar mis borradores y relevamientos
  </button>

  <a href="https://senalco-panel-tecnico.luciano-senalco.workers.dev/index.html">
    Abrir la app
  </a>

  <p id="nota"></p>

  <script>
    const destino =
      "https://senalco-panel-tecnico.luciano-senalco.workers.dev/index.html";

    const datos = {};
    let almacenamientoDisponible = true;

    try {
      for (const clave of Object.keys(localStorage)) {
        const compatible = [
          "formularioRelevamiento",
          "senalco_base_autosave",
          "senalco_cctv_autosave",
          "relevamientoBorrador1",
          "relevamientoBorrador2"
        ].includes(clave)
          || clave.startsWith("relevamiento_json_")
          || clave.startsWith("senalco_base_");

        if (!compatible) continue;

        try {
          const valor = JSON.parse(localStorage.getItem(clave));

          if (
            valor
            && typeof valor === "object"
            && !Array.isArray(valor)
            && (valor.sectores || valor.zonas)
          ) {
            datos[clave] = valor;
          }
        } catch {}
      }
    } catch {
      almacenamientoDisponible = false;
    }

    if (Object.keys(datos).length) {
      document.getElementById("mensaje").textContent =
        "Hay trabajo guardado en este dispositivo. Descargá el respaldo antes de entrar en la nueva app.";

      document.getElementById("respaldo").hidden = false;

      document.getElementById("nota").textContent =
        "En la nueva app usá Recuperar respaldo anterior, disponible en cada formulario.";

      document.getElementById("respaldo").onclick = () => {
        const contenido = JSON.stringify({
          version: 1,
          relevamientos: datos
        }, null, 2);

        const url = URL.createObjectURL(
          new Blob([contenido], { type: "application/json" })
        );

        const enlace = document.createElement("a");
        enlace.href = url;
        enlace.download = "respaldo-relevamientos.json";
        document.body.append(enlace);
        enlace.click();
        enlace.remove();

        setTimeout(() => URL.revokeObjectURL(url), 60000);
      };
    } else if (!almacenamientoDisponible) {
      document.getElementById("mensaje").textContent =
        "No se pudo revisar el trabajo guardado en este navegador. Podés abrir la nueva app desde el botón.";
    }

    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const registro =
            await navigator.serviceWorker.getRegistration();

          if (registro) await registro.unregister();
        }
      } catch {}

      if (
        almacenamientoDisponible
        && !Object.keys(datos).length
      ) {
        location.replace(destino);
      }
    })();
  </script>
</body>
</html>
