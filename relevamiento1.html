<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relevamiento de Alarmas</title>
    <link rel="stylesheet" href="estilo.css" />

    <script src="auth-guard.js"></script>
    <!-- ✅ Estilos mínimos para el panel de vista previa (no pisa tu CSS) -->
    <style>
        .preview-box {
            margin-top: 14px;
            background: #fff;
            color: #000;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 0 18px rgba(0, 0, 0, .15);
            display: none;
        }

        .preview-box.active {
            display: block;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        @media (max-width:600px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }

        .preview-kpi {
            background: #f6f6f6;
            border: 1px solid #e4e4e4;
            border-radius: 12px;
            padding: 10px;
            font-size: 14px;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .preview-table th,
        .preview-table td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
            vertical-align: top;
        }

        .preview-table th {
            background: #c10202;
            color: #fff;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        /* Áreas plegables en PC y teléfono. El contador suma las cantidades. */
        body #contenedor-sectores .area-plegable { padding: 0; overflow: hidden; }
        .area-cabecera { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: linear-gradient(90deg, #eeeeee, #ffffff); }
        body #contenedor-sectores .area-plegable h3 { flex: 1; min-width: 0; margin: 0; padding: 6px 0; background: none; border-radius: 0; font-size: 18px; overflow-wrap: anywhere; }
        .area-plegable h3:focus-visible { outline: 2px solid #1976d2; outline-offset: 3px; }
        body #contenedor-sectores .area-plegable .area-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; width: auto; min-width: 76px; min-height: 44px; margin: 0; padding: 6px 10px; border-radius: 9px; background: #e6eef8; color: #155a98; box-shadow: none; font-size: 18px; }
        body #contenedor-sectores .area-plegable .area-toggle:hover { transform: none; background: #d7e7fa; }
        .area-toggle .conteo { min-width: 24px; font-weight: 700; }
        .area-flecha { display: inline-block; font-size: 26px; line-height: 1; }
        .area-toggle[aria-expanded="true"] .area-flecha { transform: rotate(180deg); }
        .area-contenido { padding: 14px; border-top: 1px solid #d8dfea; }
        .area-contenido[hidden] { display: none; }
    </style>
    <link rel="stylesheet" href="movil.css" media="screen and (max-width: 759px)" />
</head>

<body>
    <img id="logo" src="images/logo.jpg" style="display:none;" />

    <div style="text-align:center; margin-bottom:10px;">
        <img src="images/logo_blanco.jpg" alt="Logo Señalco" class="logo-entrada">
    </div>

    <form>
        <h1>Relevamiento</h1>

        <!-- PASO 1 -->
        <div class="seccion">
            <label for="entidad">Entidad</label>
            <input type="text" id="entidad" required />

            <label for="sucursal">Sucursal</label>
            <input type="text" id="sucursal" required />

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" required />

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required />

            <label for="remito">Remito</label>
            <input type="text" id="remito" />

            <label for="relevado">Relevado por el técnico</label>
            <input type="text" id="relevado" />
        </div>

        <!-- PASO 2 -->
        <div class="seccion">
            <div id="contenedor-sectores"></div>
            <button type="button" id="btn-agregar-sector">Agregar Sector</button>
        </div>

        <!-- NAVEGACIÓN -->
        <div class="navegacion">
            <button type="button" id="atras">Atrás</button>
            <button type="button" id="siguiente">Siguiente</button>
        </div>
        <div class="navegacion" aria-label="Acciones del relevamiento">
            <button type="button" id="btn-vista-previa">Vista previa</button>
            <button type="button" id="btn-generar-pdf">Descargar PDF y guardar en el equipo</button>
            <button type="button" id="btn-borrar-form">Limpiar formulario</button>
        </div>
        <div id="json-ventana"></div>
        <div>
            <!-- ✅ Panel de Vista Previa -->
            <div id="preview-box" class="preview-box">
                <h3 style="margin:0;">👁️ Vista previa del relevamiento</h3>
                <div id="preview-head" class="preview-grid"></div>
                <div id="preview-kpis" class="preview-grid"></div>

                <div class="preview-actions">
                    <button type="button" id="btn-preview-cerrar">Cerrar vista</button>
                </div>

                <div style="margin-top:10px;">
                    <h4 style="margin:10px 0;">Detalle (tabla)</h4>
                    <div style="overflow:auto;">
                        <table class="preview-table" id="preview-table">
                            <thead>
                                <tr>
                                    <th>Sector</th>
                                    <th>Dispositivo</th>
                                    <th>Cant.</th>
                                    <th>Modelo</th>
                                    <th>Zona</th>
                                    <th>Obs</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

        <!-- DRIVE -->
        <div style="margin-top: 20px;">
            <label>📸 Subí tus fotos</label><br>
            <a href="https://drive.google.com/drive/folders/1NXZR2d9FAMhaSio-xZ4JsF-HUEnsrbOR?usp=sharing"
                target="_blank" class="drive-link">
                ➕ Subir archivos INSTALACIONES/OBRAS
            </a>
            <br>
            <a href="https://drive.google.com/drive/folders/1gnHhmociP3fHu_ecxoa6A7D9ZbnNRnlf?usp=sharing"
                target="_blank" class="drive-link">
                ➕ Subir archivos SERVICE
            </a>
            <p class="drive-note">(Abrirá Drive; creá tu carpeta de técnico y subí ahí)</p>
        </div>
    </form>

    <!-- Librerías PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.0/jspdf.plugin.autotable.min.js"></script>

    <script src="javas.js"></script>
    <script src="archivos-json.js"></script>

    <div style="text-align:center; margin-top:30px;">
        <button type="button" onclick="cerrarSesion()" style="padding:10px 20px; font-size:16px;">
            🔒 Cerrar sesión
        </button>
    </div>

    <script>
        function cerrarSesion() {
            window.senalcoAuth.logout();
        }
    </script>
</body>

</html>
